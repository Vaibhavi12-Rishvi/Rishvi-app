<p-toast></p-toast>

<div class="page-container">
  <div class="page-header">
    <h1>Change Password</h1>
  </div>

  <div class="form-container">
    <p-card>
      <form (ngSubmit)="onSubmit()" #passwordForm="ngForm">
        <div class="form-grid">
          <div class="form-field">
            <label for="current-password" class="required">Current Password</label>
            <p-password
              id="current-password"
              [ngModel]="currentPassword()"
              (ngModelChange)="currentPassword.set($event)"
              name="currentPassword"
              [feedback]="false"
              [toggleMask]="true"
              placeholder="Enter current password"
              styleClass="w-full"
              [inputStyle]="{ width: '100%' }"
              [disabled]="loading()"
              required
            ></p-password>
          </div>

          <div class="form-field">
            <label for="new-password" class="required">New Password</label>
            <p-password
              id="new-password"
              [ngModel]="newPassword()"
              (ngModelChange)="newPassword.set($event)"
              name="newPassword"
              [feedback]="true"
              [toggleMask]="true"
              placeholder="Enter new password"
              styleClass="w-full"
              [inputStyle]="{ width: '100%' }"
              promptLabel="Choose a password"
              weakLabel="Weak"
              mediumLabel="Medium"
              strongLabel="Strong"
              [disabled]="loading()"
              required
            ></p-password>
            <small class="help-text">Password must be at least 6 characters long</small>
          </div>

          <div class="form-field">
            <label for="confirm-password" class="required">Confirm New Password</label>
            <p-password
              id="confirm-password"
              [ngModel]="confirmPassword()"
              (ngModelChange)="confirmPassword.set($event)"
              name="confirmPassword"
              [feedback]="false"
              [toggleMask]="true"
              placeholder="Confirm new password"
              styleClass="w-full"
              [inputStyle]="{ width: '100%' }"
              [disabled]="loading()"
              required
            ></p-password>
          </div>

          <!-- Form Actions -->
          <div class="form-actions">
            <button
              pButton
              type="button"
              label="Cancel"
              icon="pi pi-times"
              class="p-button-secondary"
              (click)="onCancel()"
              [disabled]="loading()"
            ></button>
            <button pButton type="submit" label="Change Password" icon="pi pi-check" [loading]="loading()" [disabled]="loading()"></button>
          </div>
        </div>
      </form>
    </p-card>
  </div>
</div>
